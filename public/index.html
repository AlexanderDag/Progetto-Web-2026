<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vapor</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js" defer></script>
</head>

<body>

    <header>

        <h1>Vapor</h1>

        <div class="search-row">

            
            <button id="tutti-giochi" type="button">
                Tutti i giochi
            </button>

            
            <input
                type="search"
                id="cerca"
                placeholder="Cerca un gioco..."
                aria-label="Cerca un gioco"
            >

            
            <div class="user-menu" id="user-menu">

                <a
                    href="login.html"
                    class="login"
                    id="login-link">
                    Login
                </a>

                
            </div>

        </div>

    </header>


    <main>

        <section id="giochi" aria-label="Catalogo dei giochi">

            

            <p class="loading-message">
                Caricamento giochi...
            </p>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Vapor</p>

    </footer>

</body>

</html>
